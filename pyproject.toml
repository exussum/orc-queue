[project]
name = "orc-queue"
version = "0.0.1"
description = "Timezone-aware job queues with memory or sqlite stores, cron jobs, and a coordinator that runs them on threads or asyncio"
requires-python = ">=3.14,<3.15"
dependencies = ["cronsim==2.7"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "freezegun==1.5.5"]
lint = ["ruff==0.17.0", "mypy==2.4.0"]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orc_queue"]

[tool.ruff]
line-length = 140
target-version = "py314"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["src/orc_queue"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disable_error_code = ["type-abstract"]

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
